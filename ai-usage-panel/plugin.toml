id = "felipemayerdev/ai-usage-panel"
name = "AI Usage Panel"
version = "1.6.1"
plugin_api = 14
author = "FelipeMayerDev"
license = "MIT"
description = "Native Claude, Codex, Copilot, Z.ai, and OpenCode Zen quota monitoring for Noctalia."
dependencies = ["gh", "zen-balance"]
tags = ["ai", "bar", "panel", "system"]
icon = "chart-bar"

[[setting]]
key = "enabled_providers"
type = "string_list"
label_key = "settings.enabled_providers.label"
description_key = "settings.enabled_providers.description"
default = ["claude", "codex"]

[[setting]]
key = "refresh_interval_seconds"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 120
min = 30
max = 3600

[[setting]]
key = "icon_only"
type = "bool"
label_key = "settings.icon_only.label"
description_key = "settings.icon_only.description"
default = false

[[setting]]
key = "bar_font_size"
type = "int"
label_key = "settings.bar_font_size.label"
description_key = "settings.bar_font_size.description"
default = 12
min = 8
max = 24

[[setting]]
key = "show_reset_time"
type = "bool"
label_key = "settings.show_reset_time.label"
description_key = "settings.show_reset_time.description"
default = true


[[setting]]
key = "copilot_monthly_quota"
type = "int"
label_key = "settings.copilot_monthly_quota.label"
description_key = "settings.copilot_monthly_quota.description"
default = 300
min = 1
max = 100000
advanced = true

[[setting]]
key = "zai_token"
type = "string"
label_key = "settings.zai_token.label"
description_key = "settings.zai_token.description"
default = ""
advanced = true

[[widget]]
id = "usage"
entry = "widget.luau"

  [widget.actions]
  left = "panel-toggle felipemayerdev/ai-usage-panel:usage-panel"

[[panel]]
id = "usage-panel"
entry = "panel.luau"
width = 440
height = 320
placement = "floating"
position = "center"

[[service]]
id = "usage-service"
entry = "service.luau"
